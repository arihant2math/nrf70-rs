[package]
name = "nrf70"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Safe async nRF7002 FMAC station and Ethernet driver"
publish = false

[features]
default = []
defmt = ["dep:defmt"]
mock = ["nrf70-sys/mock", "critical-section/std", "embassy-time/std"]

[dependencies]
critical-section = "1.2"
defmt = { version = "1.0", optional = true }
embassy-net-driver-channel = "0.4"
embassy-sync = "0.8"
embassy-time = { version = "0.5", default-features = false }
embedded-hal = "1.0"
heapless = "0.9"
nrf70-sys = { path = "../nrf70-sys" }
zeroize = { version = "1", default-features = false }
