[package]
name = "nrf70-sys"
version = "0.1.0"
edition = "2024"
links = "nrf70_system"
build = "build.rs"
license = "BSD-3-Clause"
description = "Private nRF70 system-mode FMAC C binding"
publish = false

[features]
default = []
# Host-only deterministic backend for unit tests. Production builds must not enable this.
mock = []

[build-dependencies]
bindgen = "0.72"
cc = "1.2"
sha2 = "0.10"
